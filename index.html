
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cabeçalho -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano — Turma 8A — Chamada 21</p>
  </header>

  <!-- Tela de acesso por PIN -->
  <section class="acesso" id="telaAcesso">
    <div class="acesso-card">
      <h2 class="acesso-titulo">Acesso do Estudante</h2>
      <p class="acesso-info">8º Ano — Turma 8A — Chamada 21</p>
      <label class="acesso-label" for="campoPin">Digite seu PIN</label>
      <input
        type="password"
        id="campoPin"
        class="acesso-input"
        inputmode="numeric"
        autocomplete="off"
        placeholder="PIN"
      />
      <button id="btnEntrar" class="botao botao-primario">Entrar</button>
      <p id="mensagemAcesso" class="acesso-mensagem"></p>
    </div>
  </section>

  <!-- Conteúdo do boletim (escondido até o login) -->
  <main id="conteudoBoletim" class="conteudo-boletim escondido">

    <!-- Cards de resumo -->
    <section class="cards">
      <div class="card">
        <span class="card-titulo">Média Geral</span>
        <span class="card-valor" id="mediaGeral">—</span>
      </div>

      <div class="card">
        <span class="card-titulo">Total de Faltas</span>
        <span class="card-valor" id="totalFaltas">—</span>
      </div>

      <div class="card">
        <span class="card-titulo">Bom Desempenho</span>
        <span class="card-valor" id="qtdBom">—</span>
      </div>

      <div class="card">
        <span class="card-titulo">Precisam de Atenção</span>
        <span class="card-valor" id="qtdAtencao">—</span>
      </div>

      <div class="card">
        <span class="card-titulo">Frequência</span>
        <span class="card-valor" id="frequencia">—</span>
        <span class="card-obs">Frequência adequada</span>
      </div>
    </section>

    <!-- Botão de edição -->
    <section class="acoes">
      <button id="btnAlterar" class="botao botao-secundario">Alterar dados</button>
      <button id="btnSalvar" class="botao botao-primario escondido">Salvar alterações</button>
      <p id="mensagemEdicao" class="edicao-mensagem"></p>
    </section>

    <!-- Tabela de notas -->
    <section class="tabela-container">
      <table class="boletim">
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="corpoTabela">
          <!-- As linhas serão criadas pelo JavaScript -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
